<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bài 3. Xếp loại học lực</title>
</head>
<body>

    <h2>Bài 3. Xếp loại học lực</h2>
    
    <label>Nhập điểm (0-100): </label>
    <input type="text" id="diem">
    <button onclick="xepLoai()">Xếp loại</button>
    
    <p id="kqXepLoai"></p>

    <script>
        function xepLoai() {
            var d = document.getElementById("diem").value;
            var kq = "";

            if (d >= 90 && d <= 100) {
                kq = "Loại A";
            } else if (d >= 80 && d <= 89) {
                kq = "Loại B";
            } else if (d >= 70 && d <= 79) {
                kq = "Loại C";
            } else if (d >= 60 && d <= 69) {
                kq = "Loại D";
            } else if (d >= 0 && d < 60) {
                kq = "Loại F";
            } else {
                kq = "Điểm không hợp lệ (nhập từ 0-100)";
            }
            
            document.getElementById("kqXepLoai").innerHTML = "Kết quả: " + kq;
        }
    </script>

</body>
</html>
