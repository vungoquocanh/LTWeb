<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bài 13. Chuyển đổi nhiệt độ</title>
</head>
<body>
    <h2>Bài 13. Chuyển đổi nhiệt độ</h2>
    <label>Nhiệt độ (°C): </label>
    <input type="text" id="doC">
    <button onclick="chuyenDoi()">Chuyển đổi</button>
    <p id="kq"></p>

    <script>
        function chuyenDoi() {
            var c = parseFloat(document.getElementById("doC").value);
            if (isNaN(c)) {
                document.getElementById("kq").innerHTML = "Vui lòng nhập số độ C hợp lệ!";
                return;
            }
            var f = (9 / 5) * c + 32;
            document.getElementById("kq").innerHTML = c + "°C tương ứng với <b>" + f.toFixed(2) + "°F</b>";
        }
    </script>
</body>
</html>
